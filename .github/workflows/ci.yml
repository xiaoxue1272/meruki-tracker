name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消还在跑的旧任务，省 Actions 额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 单版本：项目 requires-python=">=3.12"，3.12 是下限也最稳；
        # 三个平台各一条，跨平台覆盖由 os 矩阵保证，不需要再 × Python 版本。
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        # dev 是 [project.optional-dependencies] 里的 extra，用 --extra 而非 --group。
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      # test_live.py 需要真实 Cookie 与网络，CI 里跳过。
      - name: Pytest
        run: uv run pytest --ignore=tests/test_live.py -o addopts="" -q
