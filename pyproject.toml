[project]
name = "meruki-tracker"
# 对外版本 v1.0.0-SNAPSHOT；PEP 440 不接受 SNAPSHOT 字面，故包元数据用等价开发版号。
version = "1.0.0.dev0"
description = "挖煤姬拍卖监视器"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }

dependencies = [
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "httpx>=0.27",
    "qrcode>=8.2",
    "cryptography>=50.0.2",
    "websockets>=17.4",
]

[project.optional-dependencies]
fingerprint = ["curl-cffi>=0.7"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyinstaller>=6.0",
    "tzdata>=2024.1",
    "pyyaml>=6.0",
]

[project.scripts]
meruki-tracker = "meruki_tracker.__main__:main"
mt = "meruki_tracker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meruki_tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "RUF001", "RUF002", "RUF003",
]

[tool.coverage.run]
source = ["meruki_tracker"]
